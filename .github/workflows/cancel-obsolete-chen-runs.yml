name: Cancel obsolete Chen runs
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - '.github/workflows/cancel-obsolete-chen-runs.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 38203352011 38203052570 38203273643 38202482946 38202943724; do
            echo "Cancelling $id"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id/cancel" || true
          done
