name: Chen raw session schema
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/inspect_raw_session.py'
      - '.github/workflows/chen-raw-session-schema.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy h5py
      - run: python chen_validation/inspect_raw_session.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-raw-session-schema
          path: analysis/chen_raw_schema/schema.json
          retention-days: 90
