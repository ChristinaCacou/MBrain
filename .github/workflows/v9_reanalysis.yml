name: V9 subject-level CCEP reanalysis
on:
  push:
    paths:
      - '.github/workflows/v9_reanalysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet numpy pandas scipy networkx requests beautifulsoup4 openpyxl
      - name: Convert validation to analytic autocorrelation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('v9_analysis_temp.py'); s=p.read_text()
          s=s.replace("vals=np.array(vals); z={}\n for name", "vals=np.array(vals); z={}\n total=float(np.trapezoid(vals,FREQS)); z['ac100']=float(np.trapezoid(vals*np.cos(2*np.pi*FREQS*.1),FREQS)/total)\n for name")
          s=re.sub(r"ss=\[\(sim\(Wl,Dl,SEED\+100000\+k\*10\+r\),sim\(Wh,Dh,SEED\+200000\+k\*10\+r\)\) for r in range\(4\)\]; al,_=proj\(pl,ph\)", "ss=None; al,_=proj(pl,ph)", s)
          s=s.replace("'rate_low':np.mean([q[0][0] for q in ss]),'rate_high':np.mean([q[1][0] for q in ss]),'ac100_low':np.mean([q[0][1] for q in ss]),'ac100_high':np.mean([q[1][1] for q in ss])", "'rate_low':5.0,'rate_high':5.0,'ac100_low':pl['ac100'],'ac100_high':ph['ac100']")
          s=re.sub(r"ss=\[\(sim\(Wl,Dl,SEED\+700000\+si\*10\+r\),sim\(Wh,Dh,SEED\+800000\+si\*10\+r\)\) for r in range\(2\)\]; al,sg=proj\(pl,ph\)", "ss=None; al,sg=proj(pl,ph)", s)
          p.write_text(s)
          compile(s,str(p),'exec')
          print('analytic patch applied')
          PY
      - name: Run v9 reanalysis
        run: python v9_analysis_temp.py
      - name: Upload v9 results
        uses: actions/upload-artifact@v4
        with:
          name: v9-reanalysis-results-analytic
          path: v9_results/
          retention-days: 7
