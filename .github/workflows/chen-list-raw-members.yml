name: Chen list raw members
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/list_archive_members.py'
      - '.github/workflows/chen-list-raw-members.yml'
  workflow_dispatch:
jobs:
  list:
    strategy:
      fail-fast: false
      matrix:
        archive: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install remotezip
      - env:
          ARCHIVE_INDEX: ${{ matrix.archive }}
        run: python chen_validation/list_archive_members.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-raw-manifest-${{ matrix.archive }}
          path: analysis/chen_raw_manifest/archive_${{ matrix.archive }}.json
          retention-days: 90
