name: temporary CCEP metadata fetch
on:
  push:
    paths:
      - '.github/workflows/download_ccep_metadata_temp.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download electrode metadata
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/nemarDatasets/on004080.git nemar_meta
          find nemar_meta -name '*_electrodes.tsv' -print0 | tar --null -T - -czf electrodes_tsv.tar.gz
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: ccep-electrode-metadata
          path: electrodes_tsv.tar.gz
          retention-days: 1
