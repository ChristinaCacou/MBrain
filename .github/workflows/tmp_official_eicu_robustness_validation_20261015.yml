name: Temporary official eICU robustness validation 20261015
on:
  push:
    paths:
      - '.github/workflows/tmp_official_eicu_robustness_validation_20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn matplotlib
      - name: Download official eICU demo and validate
        shell: bash
        run: |
          mkdir -p raw_eicu eicu_official_validation
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 240 -o raw_eicu/patient.csv.gz https://physionet.org/files/eicu-crd-demo/2.0.1/patient.csv.gz
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 300 -o raw_eicu/vital.csv.gz https://physionet.org/files/eicu-crd-demo/2.0.1/vitalPeriodic.csv.gz
          cat > /tmp/a.b64 <<'B64'
          
          B64
          base64 -d /tmp/a.b64 | gzip -d > /tmp/analysis.py
          python /tmp/analysis.py | tee eicu_official_validation/run.log
          cp /tmp/analysis.py eicu_official_validation/eicu_official_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-eicu-robustness-validation-20261015
          path: eicu_official_validation/
          retention-days: 7
