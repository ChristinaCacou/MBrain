name: Ghaderi post hoc robustness
on:
  push:
    branches: [ghaderi-matched-validation-20261011]
    paths:
      - 'ghaderi_validation/posthoc_robustness.py'
      - '.github/workflows/ghaderi-posthoc-robustness.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - run: python ghaderi_validation/posthoc_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghaderi-posthoc-robustness
          path: analysis/ghaderi_matched_validation/posthoc_robustness.json
