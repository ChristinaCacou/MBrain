name: Guo 2017 design-only probe
on:
  push:
    branches: [transport-theorem-guo-20261012]
    paths:
      - 'external_replication/guo2017_design_probe.py'
      - '.github/workflows/guo2017-design-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests h5py remfile numpy
      - run: python external_replication/guo2017_design_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: guo2017-design-probe
          path: analysis/guo2017_design_probe/
