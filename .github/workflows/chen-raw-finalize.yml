name: Finalize raw Chen aggregation
on:
  push:
    branches: [raw-chen-alm3-replication-20261012]
    paths:
      - '.github/workflows/chen-raw-finalize.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Close original matrix run after all session artifacts completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 38270386016 || true
          sleep 10
      - name: Download completed raw Chen session artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p all-session-results
          gh run download 38270386016 -p 'chen-direct-*' -D all-session-results
          find all-session-results -type f | sort
      - run: pip install numpy scipy
      - name: Aggregate with frozen script
        run: python raw_replication/aggregate_chen_direct.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-direct-final-forced
          path: analysis/chen_direct_final/*
          retention-days: 90
# Original run had 59/59 session artifacts but remained open before aggregate scheduling.
