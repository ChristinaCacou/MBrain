name: Zatka splitzip inventory
on:
  push:
    branches: [zatka-primary-spatial-chen-contrast-20261012]
    paths: ['zatka_primary/remote_splitzip_inventory.py','.github/workflows/zatka-splitzip-inventory.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python zatka_primary/remote_splitzip_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: zatka-splitzip-inventory
          path: analysis/zatka_primary/splitzip/matching_members.json
          retention-days: 90
