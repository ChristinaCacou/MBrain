name: Chen archive inspection
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/**'
      - '.github/workflows/chen-archive-inspection.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python chen_validation/inspect_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-archive-inspection
          path: analysis/chen_archive_inspection
