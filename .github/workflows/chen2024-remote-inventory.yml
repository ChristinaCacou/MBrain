name: Chen 2024 remote session inventory
on:
  push:
    branches: [external-replication-chen2024-20261012]
    paths:
      - 'external_replication/chen2024_remote_session_inventory.py'
      - '.github/workflows/chen2024-remote-inventory.yml'
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet h5py numpy remfile
      - run: python external_replication/chen2024_remote_session_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen2024-remote-session-inventory
          path: analysis/chen2024_remote_inventory/
          retention-days: 90
