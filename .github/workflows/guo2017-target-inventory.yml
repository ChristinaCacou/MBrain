name: Guo 2017 outcome-blind target inventory
on:
  push:
    branches: [transport-theorem-guo-20261012]
    paths:
      - 'external_replication/guo2017_target_inventory.py'
      - '.github/workflows/guo2017-target-inventory.yml'
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests h5py remfile numpy pandas
      - run: python external_replication/guo2017_target_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: guo2017-target-inventory
          path: analysis/guo2017_target_inventory/
