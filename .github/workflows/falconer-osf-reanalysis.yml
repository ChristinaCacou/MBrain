name: Falconer OSF n30 raw reanalysis

on:
  push:
    branches:
      - falconer-osf-reanalysis
    paths:
      - '.github/workflows/falconer-osf-reanalysis.yml'
      - 'analysis/falconer_osf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reanalyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn nibabel nilearn requests openpyxl

      - name: Execute independent wcuj8 reanalysis
        id: analysis
        continue-on-error: true
        run: |
          mkdir -p analysis/falconer_osf/output analysis/falconer_osf/cache
          python analysis/falconer_osf/cloud_reanalysis.py \
            --behavior analysis/falconer_osf/behavior.csv \
            --outdir analysis/falconer_osf/output \
            --cache analysis/falconer_osf/cache

      - name: Show audit
        if: always()
        run: |
          echo '=== output files ==='
          find analysis/falconer_osf/output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          echo '=== run audit ==='
          cat analysis/falconer_osf/output/run_audit.json || true

      - name: Upload reanalysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falconer-wcuj8-raw-reanalysis
          path: analysis/falconer_osf/output
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Propagate analysis failure after preserving audit
        if: steps.analysis.outcome == 'failure'
        run: exit 1
