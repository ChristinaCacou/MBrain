name: Zatka find exp47
on:
  push:
    branches: [zatka-primary-spatial-chen-contrast-20261012]
    paths: ['.github/workflows/zatka-find-exp47.yml']
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python zatka_primary/find_exp47_members.py
      - uses: actions/upload-artifact@v4
        with:
          name: zatka-exp47-members
          path: analysis/zatka_primary/exp47_members.json
