name: OUD EGR1 batch 4 same-model validation retry
on:
  push:
    branches: [analysis/oud-edger-validation-20261024]
    paths: [.github/workflows/oud-egr1-batch4-retry.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edgeR-LOO:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install official edgeR
        run: |
          Rscript -e 'install.packages("BiocManager",repos="https://cloud.r-project.org"); BiocManager::install("edgeR",ask=FALSE,update=FALSE); library(edgeR); print(R.version.string); print(packageVersion("edgeR"))'
      - name: Retrieve identical public source and matched metadata
        run: |
          curl -fLsS --retry 3 --max-time 180 -o raw_counts.csv.gz 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE174nnn/GSE174409/suppl/GSE174409_raw_counts_02102020.csv.gz'
          echo 'ae29defb14b6ac29de871f56452014c82f87f58ad31d52151cbbd99cef39870a  raw_counts.csv.gz' | sha256sum -c -
          python3 - <<'PY'
          import pathlib,re,base64,zlib
          t=pathlib.Path('.github/workflows/oud-edger-2026.yml').read_text()
          b=re.search(r'META_ZLIB_BASE64:\s*([A-Za-z0-9+/=]+)',t)
          assert b
          pathlib.Path('matched_metadata.csv').write_bytes(zlib.decompress(base64.b64decode(b.group(1))))
          assert len(pathlib.Path('matched_metadata.csv').read_text().splitlines())==81
          PY
      - name: Rerun leave-one-out edgeR for five donors
        run: |
          set -o pipefail
          Rscript validation/edgeR_EGR1_all_donors.R raw_counts.csv.gz matched_metadata.csv outputs 4 | tee run_console.log
          sha256sum raw_counts.csv.gz matched_metadata.csv validation/edgeR_EGR1_all_donors.R > outputs/INPUT_SHA256SUMS.txt
          cp run_console.log outputs/
      - name: Archive full FDR results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oud-LOO-batch-4-retry
          path: outputs/
          retention-days: 7
