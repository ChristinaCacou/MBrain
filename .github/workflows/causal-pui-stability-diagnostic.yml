name: causal-pui-stability-diagnostic
on:
  push:
    branches: [causal-pui-blinded-fixedC-20261011]
    paths:
      - 'causal_pui/diagnostic_internal_stability.py'
      - '.github/workflows/causal-pui-stability-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-pui-blinded-fixedC-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy==2.1.2 pandas==2.2.3 scipy==1.14.1
      - name: Compute frozen-feature split-half reliability
        run: python causal_pui/diagnostic_internal_stability.py
      - name: Commit diagnostic
        run: |
          git config user.name 'causal-pui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/pui_blind_fixedC/diagnostics/
          git commit -m 'Add frozen-feature stability diagnostic' || exit 0
          git push origin HEAD:causal-pui-blinded-fixedC-20261011
      - uses: actions/upload-artifact@v4
        with:
          name: causal-pui-stability-diagnostic
          path: analysis/pui_blind_fixedC/diagnostics/
          retention-days: 30
