name: Long COVID raw transcriptomics

on:
  push:
    branches: [analysis-long-covid-transcriptomics]
    paths:
      - '.github/workflows/long_covid_raw_transcriptomics.yml'
      - 'analysis/long_covid_raw_transcriptomics.py'
      - 'analysis/long_covid_raw_transcriptomics_v2.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-long-covid-transcriptomics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Run raw-count analyses
        run: python analysis/long_covid_raw_transcriptomics_v2.py
      - name: Commit compact analysis outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_outputs
          git commit -m 'Add executed GSE225517 and GSE211934 raw-count results' || exit 0
          git push origin analysis-long-covid-transcriptomics
      - name: Upload complete analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: long-covid-raw-transcriptomics
          path: analysis_outputs/
