name: Empirical CCEP and glioma reanalysis

on:
  push:
    paths:
      - '.github/workflows/empirical_reanalysis.yml'
      - 'empirical_reanalysis_temp.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet numpy scipy pandas openpyxl requests beautifulsoup4 networkx matplotlib
      - name: Run empirical CCEP and glioma analysis
        run: python empirical_reanalysis_temp.py
      - name: Upload complete empirical results
        uses: actions/upload-artifact@v4
        with:
          name: empirical-reanalysis-results
          path: |
            empirical_results/empirical_results_summary.json
            empirical_results/manuscript_ready_results.txt
            empirical_results/ccep_subject_summary.csv
            empirical_results/ccep_responsive_edges.csv
            empirical_results/ccep_subject_matrices.zip
            empirical_results/tumor_receiver_fit.json
            empirical_results/empirical_ccep_hawkes_results.csv
            empirical_results/fig_ccep_latency.png
            empirical_results/fig_receiver_validation.png
          retention-days: 7
