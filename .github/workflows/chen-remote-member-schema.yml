name: Chen remote member schema
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/inspect_remote_member.py'
      - '.github/workflows/chen-remote-member-schema.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy remotezip
      - run: python chen_validation/inspect_remote_member.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-remote-member-schema
          path: analysis/chen_raw_schema_remote/schema.json
          retention-days: 90
