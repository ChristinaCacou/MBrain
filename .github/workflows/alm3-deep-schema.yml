name: ALM3 deep schema inspection
on:
  push:
    branches: [alm3-frozen-replication-20261012]
    paths:
      - '.github/workflows/alm3-deep-schema.yml'
      - 'alm3_replication/inspect_one_deep.py'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dandi pynwb requests pandas h5py numpy
      - run: python alm3_replication/inspect_one_deep.py
      - uses: actions/upload-artifact@v4
        with:
          name: alm3-deep-schema
          path: analysis/alm3_deep_schema/deep_schema.json
          retention-days: 90
