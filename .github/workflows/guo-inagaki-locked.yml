name: Guo Inagaki locked matched-system test
on:
  push:
    paths:
      - 'external_replication/guo_inagaki_analysis.py'
      - '.github/workflows/guo-inagaki-locked.yml'
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests h5py numpy pandas scipy scikit-learn
      - run: python external_replication/guo_inagaki_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: guo-inagaki-locked-results
          path: analysis/guo_inagaki_locked
