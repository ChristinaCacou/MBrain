name: TCIA Extract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcia_extract.yml']

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official TCIA clinical workbook
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://www.cancerimagingarchive.net/wp-content/uploads/Pretreat-MetsToBrain-Masks_clin_20240410.xlsx' \
            -o Pretreat-MetsToBrain-Masks_clin_20240410.xlsx
          ls -lh Pretreat-MetsToBrain-Masks_clin_20240410.xlsx

      - name: Upload workbook
        uses: actions/upload-artifact@v4
        with:
          name: pretreat-clinical-workbook
          path: Pretreat-MetsToBrain-Masks_clin_20240410.xlsx
          retention-days: 3
