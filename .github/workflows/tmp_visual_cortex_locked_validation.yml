name: Temporary locked visual-cortex validation
on:
  push:
    paths:
      - '.github/workflows/tmp_visual_cortex_locked_validation.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy pandas scikit-learn matplotlib requests
      - name: Locked discovery-validation analysis
        shell: bash
        run: |
          cat > /tmp/locked_validation.py <<'PY'
          import json, requests, warnings
          from pathlib import Path
          import numpy as np, pandas as pd
          from scipy.io import loadmat
          from scipy.stats import spearmanr
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import RidgeClassifier, LinearRegression
          from sklearn.feature_selection import f_classif
          from sklearn.metrics import r2_score, mean_absolute_error
          import matplotlib.pyplot as plt
          warnings.filterwarnings('ignore')
          OUT=Path('locked_visual_cortex_validation'); DATA=OUT/'mat'; OUT.mkdir(exist_ok=True); DATA.mkdir(exist_ok=True)
          rng=np.random.default_rng(20261010)

          # Locked before validation: V1 is discovery; all other areas are held-out validation.
          groups=[]
          paths=[
            ('inhibitory','VISp',30,'discovery'),('excitatory','VISp',25,'discovery'),
            ('inhibitory','VISl',30,'validation'),('inhibitory','VISpm',30,'validation'),
            ('excitatory','VISal',25,'validation'),('excitatory','VISam',25,'validation'),
            ('excitatory','VISl',25,'validation'),('excitatory','VISpm',25,'validation'),('excitatory','VISrl',25,'validation')]
          for pop,area,nmax,role in paths:
              api=f'https://api.github.com/repos/zivlab/visual_drift/contents/data/calcium_{pop}/{area}'
              rr=requests.get(api,timeout=30); rr.raise_for_status(); fs=[f for f in rr.json() if f.get('name','').endswith('.mat')]
              # deterministic size-stratified sample rather than only small files: quantile-spaced indices after sorting by size.
              fs=sorted(fs,key=lambda f:f.get('size',0))
              if len(fs)>nmax:
                  idx=np.unique(np.linspace(0,len(fs)-1,nmax,dtype=int)); fs=[fs[i] for i in idx]
              groups += [(pop,area,role,f) for f in fs]
          print('selected',len(groups),'discovery',sum(g[2]=='discovery' for g in groups),'validation',sum(g[2]=='validation' for g in groups))

          def samples(arr,s,nb):
              seg=arr[:,:,s]; fpb=900//nb; X=[];y=[];rep=[]
              for r in range(10):
                  rr=seg[:,r*900:(r+1)*900]
                  for b in range(nb): X.append(np.mean(rr[:,b*fpb:(b+1)*fpb],axis=1));y.append(b);rep.append(r)
              return np.asarray(X),np.asarray(y),np.asarray(rep)
          def cmean(X,y,k): return np.vstack([X[y==i].mean(0) for i in range(k)])
          def ncorr(a,b):
              out=np.full(a.shape[1],np.nan)
              for i in range(a.shape[1]):
                  if np.std(a[:,i])>1e-9 and np.std(b[:,i])>1e-9: out[i]=np.corrcoef(a[:,i],b[:,i])[0,1]
              return out

          rows=[]; meta=[]
          fixed_splits=[np.arange(8),np.array([0,1,2,3,5,6,7,9]),np.array([0,1,2,4,5,6,8,9])]
          for fi,(pop,area,role,f) in enumerate(groups):
              try:
                  fp=DATA/(pop+'_'+area+'_'+f['name']); z=requests.get(f['download_url'],timeout=120);z.raise_for_status();fp.write_bytes(z.content)
                  a=np.asarray(loadmat(fp)['united_traces_days_events'],float)
                  if a.ndim!=3 or a.shape[1]<9000 or a.shape[2]<3: continue
                  flat=a.reshape((a.shape[0],-1),order='F')[:,:27000]
                  keep=(np.mean(np.isfinite(flat),axis=1)>.98)&(np.nanvar(flat,axis=1)>1e-10); flat=flat[keep]
                  if flat.shape[0]<8: continue
                  a=flat.reshape((flat.shape[0],9000,3),order='F')
                  meta.append({'population':pop,'area':area,'role':role,'mouse_file':f['name'][:-4],'n_cells':a.shape[0],'file_bytes':f['size']})
                  for nb in [10,30]:
                      Xs=[];ys=[];reps=[]
                      for s in range(3): X,y,r=samples(a,s,nb);Xs.append(X);ys.append(y);reps.append(r)
                      for split_id,tr_reps in enumerate(fixed_splits):
                          tr=np.isin(reps[0],tr_reps);te=~tr;sc=StandardScaler().fit(Xs[0][tr]);Xtr=sc.transform(Xs[0][tr]);Xte=sc.transform(Xs[0][te])
                          dec=RidgeClassifier(alpha=10).fit(Xtr,ys[0][tr]);acc0=dec.score(Xte,ys[0][te]);chance=1/nb
                          F,_=f_classif(Xtr,ys[0][tr]);F=np.maximum(np.nan_to_num(F,nan=0,posinf=0,neginf=0),0);w=F/(F.sum()+1e-12)
                          X0=sc.transform(Xs[0]);mu0=cmean(X0,ys[0],nb)
                          # Baseline reliability, split halves independent of future sessions.
                          ma=cmean(sc.transform(Xs[0][np.isin(reps[0],[0,1,2,3,4])]),ys[0][np.isin(reps[0],[0,1,2,3,4])],nb)
                          mb=cmean(sc.transform(Xs[0][np.isin(reps[0],[5,6,7,8,9])]),ys[0][np.isin(reps[0],[5,6,7,8,9])],nb)
                          rel=np.maximum(np.nan_to_num(ncorr(ma,mb),nan=0),0); wr=w*rel; wr=wr/(wr.sum()+1e-12)
                          den_g=np.mean(mu0**2)+1e-12;den_a=np.sum(w*np.mean(mu0**2,axis=0))+1e-12
                          for s in [1,2]:
                              Xt=sc.transform(Xs[s]);acc=dec.score(Xt,ys[s]);ret=(acc-chance)/(acc0-chance) if acc0>chance else np.nan
                              mu=cmean(Xt,ys[s],nb);d=mu-mu0
                              dg=np.sqrt(np.mean(d**2)/den_g);da=np.sqrt(np.sum(w*np.mean(d**2,axis=0))/den_a)
                              tc=ncorr(mu0,mu);td=1-tc;valid=np.isfinite(td)
                              du=np.mean(td[valid]) if valid.any() else np.nan
                              dr=np.sum(wr[valid]*td[valid])/(np.sum(wr[valid])+1e-12) if valid.any() else np.nan
                              rows.append({'population':pop,'area':area,'role':role,'mouse_file':f['name'][:-4],'n_cells':a.shape[0],'n_bins':nb,'session':s+1,'split':split_id,
                                'baseline_accuracy':acc0,'future_accuracy':acc,'loss':1-ret,
                                'global_drift':dg,'anova_amplitude_drift':da,'unweighted_tuning_drift':du,'reliability_task_tuning_drift':dr})
              except Exception as e: print('ERR',pop,area,f['name'],repr(e))
          pd.DataFrame(meta).to_csv(OUT/'file_metadata.csv',index=False)
          raw=pd.DataFrame(rows).replace([np.inf,-np.inf],np.nan).dropna();raw.to_csv(OUT/'raw_splits.csv',index=False)
          pairs=raw.groupby(['population','area','role','mouse_file','n_bins','session'],as_index=False).mean(numeric_only=True);pairs['chance']=1/pairs.n_bins;pairs['passes_qc']=pairs.baseline_accuracy>=(pairs.chance+.05);pairs.to_csv(OUT/'pairs_all.csv',index=False)
          q=pairs[pairs.passes_qc].copy();q.to_csv(OUT/'pairs_qc.csv',index=False)
          print('QC pairs',len(q),'discovery',sum(q.role=='discovery'),'validation',sum(q.role=='validation'),'mice',q.mouse_file.nunique())
          print(q.groupby(['role','area','n_bins'])[['n_cells','baseline_accuracy','future_accuracy','loss']].agg(['count','mean']).to_string())

          metrics=['global_drift','anova_amplitude_drift','unweighted_tuning_drift','reliability_task_tuning_drift']
          stats=[]
          for nb in [10,30]:
              disc=q[(q.role=='discovery')&(q.n_bins==nb)].copy();val=q[(q.role=='validation')&(q.n_bins==nb)].copy()
              for m in metrics:
                  rhoD,pD=spearmanr(disc[m],disc.loss);rhoV,pV=spearmanr(val[m],val.loss)
                  lm=LinearRegression().fit(disc[[m]],disc.loss)
                  pv=lm.predict(val[[m]])
                  # validation leave-one-mouse-out within held-out non-V1 data
                  v=val.reset_index(drop=True);pp=np.full(len(v),np.nan)
                  for mouse in v.mouse_file.unique():
                      tr=v.mouse_file!=mouse;te=~tr;mm=LinearRegression().fit(v.loc[tr,[m]],v.loc[tr,'loss']);pp[te]=mm.predict(v.loc[te,[m]])
                  stats.append({'n_bins':nb,'metric':m,'discovery_n':len(disc),'validation_n':len(val),
                    'discovery_rho':rhoD,'discovery_p':pD,'validation_rho':rhoV,'validation_p':pV,
                    'v1_to_nonv1_r2':r2_score(val.loss,pv),'v1_to_nonv1_mae':mean_absolute_error(val.loss,pv),
                    'validation_lomo_r2':r2_score(v.loss,pp),'validation_lomo_mae':mean_absolute_error(v.loss,pp)})
          st=pd.DataFrame(stats);st.to_csv(OUT/'locked_metric_stats.csv',index=False);print(st.to_string(index=False))

          # Area-level validation correlations and LOMO, formula fixed before examining these areas.
          ars=[]
          for nb in [10,30]:
              for area,df in q[(q.role=='validation')&(q.n_bins==nb)].groupby('area'):
                  if len(df)<8:continue
                  for m in metrics:
                      rho,p=spearmanr(df[m],df.loss)
                      ars.append({'n_bins':nb,'area':area,'n_pairs':len(df),'metric':m,'rho':rho,'p':p})
          ar=pd.DataFrame(ars);ar.to_csv(OUT/'area_specific_correlations.csv',index=False);print(ar.to_string(index=False))

          # Bootstrap held-out validation mice: paired MAE advantage after fitting each metric on V1 discovery only.
          boots=[];rg=np.random.default_rng(1203)
          for nb in [10,30]:
              disc=q[(q.role=='discovery')&(q.n_bins==nb)].copy();v=q[(q.role=='validation')&(q.n_bins==nb)].reset_index(drop=True)
              preds={}
              for m in metrics:
                  lm=LinearRegression().fit(disc[[m]],disc.loss);preds[m]=lm.predict(v[[m]])
              mice=v.mouse_file.unique()
              for comp in ['anova_amplitude_drift','unweighted_tuning_drift','reliability_task_tuning_drift']:
                  aeG=np.abs(v.loss.values-preds['global_drift']);aeC=np.abs(v.loss.values-preds[comp]);obs=np.mean(aeG-aeC);bb=[]
                  for _ in range(5000):
                      sm=rg.choice(mice,len(mice),replace=True);idx=np.concatenate([np.where(v.mouse_file.values==mm)[0] for mm in sm]);bb.append(np.mean(aeG[idx]-aeC[idx]))
                  bb=np.asarray(bb);boots.append({'n_bins':nb,'comparison':comp+'_vs_global','mae_advantage':obs,'ci_low':np.quantile(bb,.025),'ci_high':np.quantile(bb,.975),'p_advantage':(1+np.sum(bb<=0))/(len(bb)+1)})
          bd=pd.DataFrame(boots);bd.to_csv(OUT/'locked_bootstrap.csv',index=False);print(bd.to_string(index=False))

          # Figures
          for nb in [10,30]:
              ss=st[st.n_bins==nb].set_index('metric');fig=plt.figure(figsize=(7.8,5.4));ax=fig.add_axes([.13,.2,.84,.72]);order=metrics;labs=['Global amplitude','Task-weighted\namplitude','Unweighted\ntuning','Reliability×task\ntuning'];
              ax.bar(np.arange(4),[ss.loc[m,'validation_rho'] for m in order]);ax.set_xticks(np.arange(4));ax.set_xticklabels(labs,rotation=12,ha='right');ax.set_ylabel('Spearman rho with cross-session decoding loss');ax.set_title(f'Held-out non-V1 validation ({nb} movie-time bins)');fig.savefig(OUT/f'Fig_locked_validation_rho_{nb}bin.png',dpi=300,bbox_inches='tight');plt.close(fig)
          (OUT/'summary.json').write_text(json.dumps({'stats':st.to_dict('records'),'bootstrap':bd.to_dict('records'),'n_files':len(meta)},indent=2))
          PY
          python /tmp/locked_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: locked-visual-cortex-validation
          path: locked_visual_cortex_validation/
          retention-days: 7
