name: One-off OUD edgeR validation
on:
  push:
    branches:
      - analysis/oud-edger-validation-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-edger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install R and official Bioconductor edgeR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y r-base-core r-bioc-edger
          Rscript -e 'library(edgeR); print(packageVersion("edgeR"))'
      - name: Retrieve original public raw counts
        run: |
          curl -fSL --retry 3 --max-time 180 --output raw_counts.csv.gz 'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE174nnn/GSE174409/suppl/GSE174409_raw_counts_02102020.csv.gz'
          gzip -t raw_counts.csv.gz
          echo 'ae29defb14b6ac29de871f56452014c82f87f58ad31d52151cbbd99cef39870a  raw_counts.csv.gz' | sha256sum -c -
      - name: Recover published donor covariates
        env:
          META_ZLIB_BASE64: 
        run: |
          printf '%s' "$META_ZLIB_BASE64" | base64 -d | python3 -c 'import sys,zlib;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))' > matched_metadata.csv
          test "$(wc -l < matched_metadata.csv)" -eq 81
      - name: Execute official edgeR quasi-likelihood pipeline
        run: |
          Rscript validation/run_discovery_edgeR.R raw_counts.csv.gz matched_metadata.csv results | tee edgeR_console_log.txt
          test -f results/edgeR_VERIFIED_SUMMARY.csv
          cat results/edgeR_VERIFIED_SUMMARY.csv
          sha256sum raw_counts.csv.gz matched_metadata.csv validation/run_discovery_edgeR.R > results/INPUT_SHA256SUMS.txt
          cp edgeR_console_log.txt results/
      - name: Preserve scientific outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oud-edgeR-official-output
          path: |
            results/
            edgeR_console_log.txt
          retention-days: 7
