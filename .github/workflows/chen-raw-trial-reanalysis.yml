name: Chen raw trial-level reanalysis
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - '.github/workflows/chen-raw-trial-reanalysis.yml'
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install remotezip
      - id: m
        shell: bash
        run: |
          MATRIX=$(python chen_validation/prepare_raw_matrix.py)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"
  session:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy remotezip
      - env:
          ARCHIVE_INDEX: ${{ matrix.item.archive }}
          MEMBER: ${{ matrix.item.member }}
        run: python chen_validation/analyze_raw_session.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-raw-${{ strategy.job-index }}
          path: analysis/chen_raw_sessions/*.json
          retention-days: 90
  aggregate:
    needs: session
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: chen-raw-*
          path: all-session-results
      - run: pip install numpy scipy
      - run: python chen_validation/aggregate_raw_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-raw-final
          path: analysis/chen_raw_final/*
          retention-days: 90
