name: Chen source context
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/source_context.py'
      - '.github/workflows/chen-source-context.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python chen_validation/source_context.py
