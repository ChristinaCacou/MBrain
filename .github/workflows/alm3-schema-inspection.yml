name: ALM3 frozen replication schema inspection
on:
  push:
    branches: [alm3-frozen-replication-20261012]
    paths:
      - '.github/workflows/alm3-schema-inspection.yml'
      - 'alm3_replication/inspect_one.py'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dandi pynwb requests pandas h5py
      - run: python alm3_replication/inspect_one.py
      - uses: actions/upload-artifact@v4
        with:
          name: alm3-schema
          path: analysis/alm3_schema/schema.json
          retention-days: 90
