name: Ghaderi matched validation
on:
  push:
    branches: [ghaderi-matched-validation-20261011]
    paths:
      - 'ghaderi_validation/**'
      - '.github/workflows/ghaderi-matched-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy remotezip requests
      - run: python ghaderi_validation/run_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghaderi-matched-validation-results
          path: analysis/ghaderi_matched_validation
