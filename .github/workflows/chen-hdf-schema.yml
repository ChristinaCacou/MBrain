name: Chen v7.3 schema
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/inspect_remote_member_hdf.py'
      - '.github/workflows/chen-hdf-schema.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy remotezip mat73 h5py
      - run: python chen_validation/inspect_remote_member_hdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-hdf-schema
          path: analysis/chen_hdf_schema/schema.json
          retention-days: 90
