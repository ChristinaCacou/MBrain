name: Chen same-session bridge analysis
on:
  push:
    branches: [chen-matched-validation-20261011]
    paths:
      - 'chen_validation/run_bridge_analysis.py'
      - '.github/workflows/chen-bridge-analysis.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python chen_validation/run_bridge_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: chen-bridge-results
          path: analysis/chen_bridge
