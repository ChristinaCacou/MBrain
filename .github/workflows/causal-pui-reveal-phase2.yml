name: causal-pui-reveal-phase2
on:
  push:
    branches: [causal-pui-blinded-fixedC-20261011]
    paths:
      - 'causal_pui/phase2_reveal_evaluate.py'
      - '.github/workflows/causal-pui-reveal-phase2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-pui-blinded-fixedC-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation environment
        run: python -m pip install --upgrade pip && pip install numpy==2.1.2 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 tabulate==0.9.0
      - name: Reveal outcomes and evaluate frozen predictor once
        run: python causal_pui/phase2_reveal_evaluate.py
      - name: Commit one-shot evaluation
        run: |
          git config user.name 'causal-pui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/pui_blind_fixedC/reveal/
          git commit -m 'Record exact blinded causal prediction result' || exit 0
          git push origin HEAD:causal-pui-blinded-fixedC-20261011
      - uses: actions/upload-artifact@v4
        with:
          name: causal-pui-exact-blinded-result
          path: analysis/pui_blind_fixedC/reveal/
          retention-days: 30
