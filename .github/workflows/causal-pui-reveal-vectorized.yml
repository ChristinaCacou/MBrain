name: causal-pui-reveal-vectorized
on:
  push:
    branches: [causal-pui-blinded-fixedC-20261011]
    paths:
      - 'causal_pui/phase2_reveal_evaluate_vectorized.py'
      - '.github/workflows/causal-pui-reveal-vectorized.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-pui-blinded-fixedC-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy==2.1.2 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Evaluate frozen predictor
        run: python causal_pui/phase2_reveal_evaluate_vectorized.py
      - name: Commit result
        run: |
          git config user.name 'causal-pui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/pui_blind_fixedC/reveal_vectorized/
          git commit -m 'Record vectorized exact causal reveal result' || exit 0
          git push origin HEAD:causal-pui-blinded-fixedC-20261011
      - uses: actions/upload-artifact@v4
        with:
          name: causal-pui-vectorized-result
          path: analysis/pui_blind_fixedC/reveal_vectorized/
          retention-days: 30
